<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0F1117">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="50%" stop-color="#171A24" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <pattern id="fn-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#fn-bg)" />
  <rect width="1200" height="675" fill="url(#fn-grid)" />
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="rgba(255, 85, 0, 0.25)" stroke-width="1.5" />

  <!-- Left Side: Narrative -->
  <g transform="translate(70, 80)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="rgba(255,85,0,0.15)" stroke="#FF5500" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="11" fill="#FF5500" font-weight="bold" text-anchor="middle" letter-spacing="1">FIGMA // MOBILE APP UI</text>

    <text x="0" y="95" font-family="sans-serif" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">FixNow</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" fill="#FF5500" font-weight="600">Home Service &amp; Repair Booking App</text>
    <text x="0" y="165" font-family="monospace" font-size="13" fill="#94A3B8">UI/UX Challenge &bull; Webtezza (Pvt) Ltd</text>

    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="80" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="40" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="105" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="142" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Mobile UI</text>

      <rect x="205" y="0" width="115" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="262" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">User Flows</text>

      <rect x="330" y="0" width="125" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="392" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Auto Layout</text>
    </g>

    <g transform="translate(0, 265)">
      <circle cx="8" cy="12" r="5" fill="#FF5500" />
      <text x="25" y="16" font-family="monospace" font-size="15" fill="#CBD5E1">End-to-end service booking &amp; verified technician flows</text>

      <circle cx="8" cy="46" r="5" fill="#D4FF00" />
      <text x="25" y="50" font-family="monospace" font-size="15" fill="#CBD5E1">Instant upfront pricing estimates &amp; calendar scheduling</text>

      <circle cx="8" cy="80" r="5" fill="#FF5500" />
      <text x="25" y="84" font-family="monospace" font-size="15" fill="#CBD5E1">Interactive mobile prototype with stateful micro-interactions</text>
    </g>

    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="260" height="42" rx="4" fill="#FF5500" />
      <text x="130" y="26" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">MOBILE PROTOTYPE SPECS</text>
    </g>
  </g>

  <!-- Right: Two Mobile App Screens -->
  <g transform="translate(730, 75)">
    <!-- Phone 1 -->
    <rect x="0" y="0" width="200" height="420" rx="24" fill="#181B22" stroke="#2D333F" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))" />
    <rect x="8" y="8" width="184" height="404" rx="18" fill="#0F1218" />
    <!-- Notch -->
    <rect x="65" y="14" width="70" height="12" rx="6" fill="#181B22" />
    <!-- Content Screen 1 -->
    <text x="20" y="50" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">FixNow Home</text>
    <rect x="20" y="65" width="160" height="50" rx="8" fill="#1F2430" />
    <text x="30" y="86" font-family="sans-serif" font-size="10" fill="#94A3B8">Fast Plumber &amp; AC</text>
    <text x="30" y="102" font-family="monospace" font-size="11" fill="#FF5500" font-weight="bold">Available in 15m</text>

    <!-- Services Grid -->
    <rect x="20" y="125" width="75" height="60" rx="6" fill="#1A202A" />
    <text x="57" y="150" font-family="sans-serif" font-size="16" text-anchor="middle">🔧</text>
    <text x="57" y="172" font-family="sans-serif" font-size="9" fill="#E2E8F0" text-anchor="middle">Repairs</text>

    <rect x="105" y="125" width="75" height="60" rx="6" fill="#1A202A" />
    <text x="142" y="150" font-family="sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="142" y="172" font-family="sans-serif" font-size="9" fill="#E2E8F0" text-anchor="middle">Electric</text>

    <rect x="20" y="195" width="75" height="60" rx="6" fill="#1A202A" />
    <text x="57" y="220" font-family="sans-serif" font-size="16" text-anchor="middle">🚿</text>
    <text x="57" y="242" font-family="sans-serif" font-size="9" fill="#E2E8F0" text-anchor="middle">Plumbing</text>

    <rect x="105" y="195" width="75" height="60" rx="6" fill="#1A202A" />
    <text x="142" y="220" font-family="sans-serif" font-size="16" text-anchor="middle">🧹</text>
    <text x="142" y="242" font-family="sans-serif" font-size="9" fill="#E2E8F0" text-anchor="middle">Cleaning</text>

    <!-- Phone 2 (Offset / Floating) -->
    <g transform="translate(180, 70)">
      <rect x="0" y="0" width="200" height="420" rx="24" fill="#181B22" stroke="#FF5500" stroke-width="2.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />
      <rect x="8" y="8" width="184" height="404" rx="18" fill="#0F1218" />
      <rect x="65" y="14" width="70" height="12" rx="6" fill="#181B22" />
      <text x="20" y="50" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Service Details</text>
      <!-- Technician Card -->
      <rect x="20" y="65" width="160" height="60" rx="8" fill="#1F2430" stroke="rgba(255,255,255,0.08)" />
      <circle cx="45" cy="95" r="15" fill="#FF5500" />
      <text x="45" y="99" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold" text-anchor="middle">EP</text>
      <text x="70" y="90" font-family="sans-serif" font-size="11" fill="#FFF" font-weight="bold">Praveen A.</text>
      <text x="70" y="105" font-family="monospace" font-size="9" fill="#D4FF00">★ 4.9 (128 reviews)</text>

      <rect x="20" y="140" width="160" height="90" rx="8" fill="#141820" />
      <text x="30" y="165" font-family="sans-serif" font-size="10" fill="#94A3B8">Estimated Total</text>
      <text x="30" y="195" font-family="sans-serif" font-size="22" fill="#FF5500" font-weight="bold">Rs. 3,500</text>
      <text x="30" y="215" font-family="monospace" font-size="9" fill="#64748B">Includes travel &amp; inspection</text>

      <rect x="20" y="340" width="160" height="36" rx="18" fill="#FF5500" />
      <text x="100" y="363" font-family="sans-serif" font-size="11" fill="#FFF" font-weight="bold" text-anchor="middle">Confirm Booking ➔</text>
    </g>
  </g>
</svg>