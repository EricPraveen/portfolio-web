<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0F1218">
  <defs>
    <linearGradient id="cricket-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1218" />
      <stop offset="50%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <pattern id="cricket-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#cricket-bg)" />
  <rect width="1200" height="675" fill="url(#cricket-grid)" />

  <!-- Outer frame border with glowing corners -->
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="rgba(212, 255, 0, 0.2)" stroke-width="1.5" />
  
  <!-- Left Side: Project Narrative & Engine Specs -->
  <g transform="translate(70, 80)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="32" rx="4" fill="rgba(212,255,0,0.12)" stroke="#D4FF00" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="12" fill="#D4FF00" font-weight="bold" text-anchor="middle" letter-spacing="1">MOBILE APP // OFFLINE-FIRST</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="sans-serif" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">CricketScore</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" fill="#00E5FF" font-weight="600">Offline Cricket Scoring &amp; Real-Time Analytics</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="125" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="62" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">React Native</text>

      <rect x="135" y="0" width="115" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="192" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">TypeScript</text>

      <rect x="260" y="0" width="75" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="297" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Expo</text>

      <rect x="345" y="0" width="85" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="387" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">SQLite</text>

      <rect x="440" y="0" width="115" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="497" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Reanimated</text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(0, 230)">
      <circle cx="8" cy="12" r="5" fill="#D4FF00" />
      <text x="25" y="16" font-family="monospace" font-size="15" fill="#CBD5E1">Strike rotation &amp; extras state machine engine</text>

      <circle cx="8" cy="46" r="5" fill="#00E5FF" />
      <text x="25" y="50" font-family="monospace" font-size="15" fill="#CBD5E1">Instant single/multi-ball undo delivery mechanism</text>

      <circle cx="8" cy="80" r="5" fill="#D4FF00" />
      <text x="25" y="84" font-family="monospace" font-size="15" fill="#CBD5E1">Normalized relational SQLite schema for matches &amp; balls</text>

      <circle cx="8" cy="114" r="5" fill="#00E5FF" />
      <text x="25" y="118" font-family="monospace" font-size="15" fill="#CBD5E1">Ball-by-ball wagon wheel &amp; milestone celebrations</text>
    </g>

    <!-- Bottom Verification Stamp -->
    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="260" height="42" rx="4" fill="#D4FF00" />
      <text x="130" y="26" font-family="monospace" font-size="14" fill="#0F1218" font-weight="bold" text-anchor="middle" letter-spacing="0.5">VERIFIED GITHUB BUILD</text>
    </g>
  </g>

  <!-- Right Side: Simulated Mobile Device Frame & Live Scorecard -->
  <g transform="translate(710, 65)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="410" height="545" rx="36" fill="#161A22" stroke="#2D3748" stroke-width="4" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />
    <rect x="12" y="12" width="386" height="521" rx="28" fill="#0B0E14" />

    <!-- Phone Notch -->
    <rect x="145" y="18" width="120" height="18" rx="9" fill="#161A22" />

    <!-- App Header -->
    <g transform="translate(30, 55)">
      <text x="0" y="16" font-family="sans-serif" font-size="16" fill="#F8FAFC" font-weight="700">CricketScore</text>
      <text x="325" y="16" font-family="monospace" font-size="11" fill="#00E5FF" text-anchor="end">LIVE INNINGS</text>
    </g>

    <!-- Match Status Banner -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="326" height="42" rx="8" fill="#151A24" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="16" y="26" font-family="sans-serif" font-size="13" fill="#94A3B8">Mora Titans vs Royal Strikers</text>
      <rect x="250" y="10" width="60" height="22" rx="4" fill="rgba(212,255,0,0.15)" />
      <text x="280" y="25" font-family="monospace" font-size="10" fill="#D4FF00" font-weight="bold" text-anchor="middle">1st INN</text>
    </g>

    <!-- Score Big Card -->
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="326" height="110" rx="12" fill="linear-gradient(135deg, #1A2130, #131822)" stroke="rgba(212,255,0,0.3)" stroke-width="1.5" />
      <text x="20" y="44" font-family="sans-serif" font-size="38" fill="#FFFFFF" font-weight="900">184 / 4</text>
      <text x="20" y="70" font-family="monospace" font-size="13" fill="#94A3B8">Overs: <tspan fill="#00E5FF" font-weight="bold">19.2</tspan> / 20</text>
      <text x="20" y="92" font-family="monospace" font-size="12" fill="#64748B">CRR: 9.52 &bull; Projected: 191</text>

      <!-- Strike indicator circle -->
      <circle cx="280" cy="55" r="28" fill="rgba(0,229,255,0.12)" stroke="#00E5FF" stroke-width="1.5" />
      <text x="280" y="52" font-family="monospace" font-size="9" fill="#00E5FF" text-anchor="middle">FREE HIT</text>
      <text x="280" y="66" font-family="monospace" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- Ball by Ball Tracker -->
    <g transform="translate(30, 265)">
      <text x="0" y="14" font-family="monospace" font-size="11" fill="#64748B">THIS OVER (19th):</text>
      <g transform="translate(0, 24)">
        <circle cx="18" cy="18" r="16" fill="#1E2638" stroke="rgba(255,255,255,0.1)" />
        <text x="18" y="23" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

        <circle cx="58" cy="18" r="16" fill="#1E2638" stroke="rgba(255,255,255,0.1)" />
        <text x="58" y="23" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">4</text>

        <circle cx="98" cy="18" r="16" fill="#EF4444" stroke="#DC2626" />
        <text x="98" y="23" font-family="monospace" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">W</text>

        <circle cx="138" cy="18" r="16" fill="#D4FF00" stroke="#A3E635" />
        <text x="138" y="23" font-family="monospace" font-size="13" fill="#0F1218" font-weight="900" text-anchor="middle">6</text>

        <circle cx="178" cy="18" r="16" fill="#1E2638" stroke="rgba(255,255,255,0.1)" />
        <text x="178" y="23" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

        <circle cx="218" cy="18" r="16" fill="#00E5FF" stroke="#38BDF8" />
        <text x="218" y="23" font-family="monospace" font-size="11" fill="#0F1218" font-weight="bold" text-anchor="middle">Nb</text>
      </g>
    </g>

    <!-- Key Engine Controls (Undo, Extras) -->
    <g transform="translate(30, 345)">
      <rect x="0" y="0" width="155" height="44" rx="8" fill="#1A2232" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="77" y="27" font-family="monospace" font-size="12" fill="#F8FAFC" text-anchor="middle">↺ UNDO BALL</text>

      <rect x="170" y="0" width="156" height="44" rx="8" fill="#1A2232" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="248" y="27" font-family="monospace" font-size="12" fill="#F8FAFC" text-anchor="middle">+ EXTRAS MENU</text>
    </g>

    <!-- Scoring keypad preview -->
    <g transform="translate(30, 405)">
      <rect x="0" y="0" width="75" height="38" rx="6" fill="#1E283C" />
      <text x="37" y="24" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">0</text>

      <rect x="84" y="0" width="75" height="38" rx="6" fill="#1E283C" />
      <text x="121" y="24" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>

      <rect x="168" y="0" width="75" height="38" rx="6" fill="#1E283C" />
      <text x="205" y="24" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>

      <rect x="252" y="0" width="74" height="38" rx="6" fill="#D4FF00" />
      <text x="289" y="24" font-family="monospace" font-size="14" fill="#0F1218" font-weight="900" text-anchor="middle">4 / 6</text>
    </g>
  </g>
</svg>