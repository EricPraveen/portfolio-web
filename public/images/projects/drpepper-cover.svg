<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#14080B">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080B" />
      <stop offset="50%" stop-color="#240D14" />
      <stop offset="100%" stop-color="#0A0406" />
    </linearGradient>
    <pattern id="dp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#dp-bg)" />
  <rect width="1200" height="675" fill="url(#dp-grid)" />
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="rgba(225, 29, 72, 0.25)" stroke-width="1.5" />

  <!-- Left: Narrative -->
  <g transform="translate(70, 80)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="rgba(225,29,72,0.15)" stroke="#E11D48" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="11" fill="#FB7185" font-weight="bold" text-anchor="middle" letter-spacing="1">FIGMA // PRODUCT LANDING</text>

    <text x="0" y="95" font-family="sans-serif" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">Dr. Pepper</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" fill="#FB7185" font-weight="600">Interactive Product Showcase Concept</text>
    <text x="0" y="165" font-family="monospace" font-size="13" fill="#94A3B8">Personal UI Design Experiment &bull; Figma</text>

    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="80" height="28" rx="4" fill="#1C1014" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="40" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="115" height="28" rx="4" fill="#1C1014" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="147" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Landing Pages</text>

      <rect x="215" y="0" width="115" height="28" rx="4" fill="#1C1014" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="272" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Typography</text>

      <rect x="340" y="0" width="125" height="28" rx="4" fill="#1C1014" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="402" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Visual Hierarchy</text>
    </g>

    <g transform="translate(0, 265)">
      <circle cx="8" cy="12" r="5" fill="#E11D48" />
      <text x="25" y="16" font-family="monospace" font-size="15" fill="#CBD5E1">High-impact brand typography &amp; visual composition</text>

      <circle cx="8" cy="46" r="5" fill="#D4FF00" />
      <text x="25" y="50" font-family="monospace" font-size="15" fill="#CBD5E1">Interactive 23-flavor wheel &amp; can variant carousel</text>

      <circle cx="8" cy="80" r="5" fill="#E11D48" />
      <text x="25" y="84" font-family="monospace" font-size="15" fill="#CBD5E1">Figma smart-animate prototype with smooth transitions</text>
    </g>

    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="260" height="42" rx="4" fill="#E11D48" />
      <text x="130" y="26" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">INTERACTIVE LANDING SPEC</text>
    </g>
  </g>

  <!-- Right: Landing Page Mockup Frame -->
  <g transform="translate(680, 85)">
    <rect x="0" y="0" width="460" height="490" rx="12" fill="#1C0E13" stroke="rgba(225,29,72,0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />
    <rect x="0" y="0" width="460" height="40" rx="12" fill="#28131B" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" />
    <circle cx="52" cy="20" r="5" fill="#10B981" />
    <text x="230" y="25" font-family="monospace" font-size="11" fill="#FB7185" text-anchor="middle">dr-pepper-landing.fig</text>

    <!-- Header mockup -->
    <text x="30" y="70" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="900">Dr Pepper</text>
    <text x="350" y="70" font-family="sans-serif" font-size="10" fill="#FB7185">Explore Flavors ➔</text>

    <!-- Big Headline Hero -->
    <text x="30" y="130" font-family="sans-serif" font-size="34" fill="#FFFFFF" font-weight="900">THE 23 ORIGINAL</text>
    <text x="30" y="170" font-family="sans-serif" font-size="34" fill="#E11D48" font-weight="900">FLAVORS.</text>
    <text x="30" y="200" font-family="sans-serif" font-size="12" fill="#94A3B8">Experience authentic taste with zero compromises.</text>

    <!-- Product Can Graphic Simulation -->
    <g transform="translate(260, 190)">
      <rect x="40" y="20" width="110" height="210" rx="20" fill="linear-gradient(135deg, #7F1D1D, #991B1B, #450A0A)" stroke="#E11D48" stroke-width="2" />
      <text x="95" y="125" font-family="sans-serif" font-size="20" fill="#FFF" font-weight="900" text-anchor="middle" transform="rotate(-90 95 125)">Dr Pepper</text>
      <!-- Condensation dots -->
      <circle cx="65" cy="80" r="3" fill="rgba(255,255,255,0.4)" />
      <circle cx="120" cy="110" r="2.5" fill="rgba(255,255,255,0.4)" />
      <circle cx="75" cy="160" r="3.5" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- Flavor selector pills -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#E11D48" />
      <text x="50" y="20" font-family="sans-serif" font-size="10" fill="#FFF" font-weight="bold" text-anchor="middle">Original</text>

      <rect x="110" y="0" width="100" height="32" rx="16" fill="#2D141C" stroke="rgba(255,255,255,0.1)" />
      <text x="160" y="20" font-family="sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Cherry</text>

      <rect x="0" y="42" width="100" height="32" rx="16" fill="#2D141C" stroke="rgba(255,255,255,0.1)" />
      <text x="50" y="62" font-family="sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Strawberries</text>

      <rect x="110" y="42" width="100" height="32" rx="16" fill="#2D141C" stroke="rgba(255,255,255,0.1)" />
      <text x="160" y="62" font-family="sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Zero Sugar</text>
    </g>
  </g>
</svg>