<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#130E14">
  <defs>
    <linearGradient id="dn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130E14" />
      <stop offset="50%" stop-color="#1E1422" />
      <stop offset="100%" stop-color="#0A080C" />
    </linearGradient>
    <pattern id="dn-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#dn-bg)" />
  <rect width="1200" height="675" fill="url(#dn-grid)" />
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1.5" />

  <!-- Left: Narrative -->
  <g transform="translate(70, 80)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="rgba(236,72,153,0.15)" stroke="#EC4899" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="11" fill="#F472B6" font-weight="bold" text-anchor="middle" letter-spacing="1">FIGMA // ANIMATED UI</text>

    <text x="0" y="95" font-family="sans-serif" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">Donut</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" fill="#F472B6" font-weight="600">Animated Dessert Landing Concept</text>
    <text x="0" y="165" font-family="monospace" font-size="13" fill="#94A3B8">Personal UI Design Experiment &bull; Figma</text>

    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="80" height="28" rx="4" fill="#1C1420" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="40" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="90" height="28" rx="4" fill="#1C1420" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="135" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Animation</text>

      <rect x="190" y="0" width="105" height="28" rx="4" fill="#1C1420" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="242" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Prototyping</text>

      <rect x="305" y="0" width="135" height="28" rx="4" fill="#1C1420" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="372" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Component Variants</text>
    </g>

    <g transform="translate(0, 265)">
      <circle cx="8" cy="12" r="5" fill="#EC4899" />
      <text x="25" y="16" font-family="monospace" font-size="15" fill="#CBD5E1">Playful desktop landing concept exploring motion aesthetics</text>

      <circle cx="8" cy="46" r="5" fill="#D4FF00" />
      <text x="25" y="50" font-family="monospace" font-size="15" fill="#CBD5E1">Interactive flavor carousel with smart-animate transitions</text>

      <circle cx="8" cy="80" r="5" fill="#EC4899" />
      <text x="25" y="84" font-family="monospace" font-size="15" fill="#CBD5E1">Asset composition, typography, and interactive prototype</text>
    </g>

    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="260" height="42" rx="4" fill="#EC4899" />
      <text x="130" y="26" font-family="monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">FIGMA PROTOTYPE SPEC</text>
    </g>
  </g>

  <!-- Right: Playful Donut Screen Mockup -->
  <g transform="translate(680, 85)">
    <rect x="0" y="0" width="460" height="490" rx="12" fill="#1C121E" stroke="rgba(236,72,153,0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />
    <rect x="0" y="0" width="460" height="40" rx="12" fill="#26162A" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" />
    <circle cx="52" cy="20" r="5" fill="#10B981" />
    <text x="230" y="25" font-family="monospace" font-size="11" fill="#F472B6" text-anchor="middle">donut-landing-anim.fig</text>

    <!-- Big Donut Vector Graphic -->
    <g transform="translate(230, 220)">
      <!-- Donut Dough -->
      <circle cx="0" cy="0" r="100" fill="#E0A96D" stroke="#C2874E" stroke-width="6" />
      <!-- Frosting -->
      <circle cx="0" cy="0" r="85" fill="#EC4899" />
      <!-- Hole -->
      <circle cx="0" cy="0" r="35" fill="#1C121E" stroke="#C2874E" stroke-width="5" />
      <!-- Sprinkles -->
      <rect x="-50" y="-40" width="12" height="4" rx="2" fill="#D4FF00" transform="rotate(25 -50 -40)" />
      <rect x="30" y="-50" width="12" height="4" rx="2" fill="#00E5FF" transform="rotate(-30 30 -50)" />
      <rect x="45" y="20" width="12" height="4" rx="2" fill="#FACC15" transform="rotate(45 45 20)" />
      <rect x="-40" y="40" width="12" height="4" rx="2" fill="#FFFFFF" transform="rotate(-15 -40 40)" />
      <rect x="0" y="-70" width="12" height="4" rx="2" fill="#FFFFFF" transform="rotate(10 0 -70)" />
    </g>

    <!-- UI Copy Overlays -->
    <text x="30" y="100" font-family="sans-serif" font-size="28" fill="#FFF" font-weight="900">SWEET CRAVINGS,</text>
    <text x="30" y="130" font-family="sans-serif" font-size="28" fill="#EC4899" font-weight="900">FRESH DAILY.</text>

    <rect x="30" y="380" width="150" height="40" rx="20" fill="#EC4899" />
    <text x="105" y="405" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold" text-anchor="middle">Order Box ➔</text>
  </g>
</svg>
