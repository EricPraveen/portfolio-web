<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0D1117">
  <defs>
    <linearGradient id="wp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>
    <pattern id="wp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#wp-bg)" />
  <rect width="1200" height="675" fill="url(#wp-grid)" />
  <rect x="30" y="30" width="1140" height="615" rx="8" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />

  <!-- Left: Content Narrative -->
  <g transform="translate(70, 80)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="rgba(0,229,255,0.12)" stroke="#00E5FF" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="11" fill="#00E5FF" font-weight="bold" text-anchor="middle" letter-spacing="1">FIGMA // ENTERPRISE UI/UX</text>

    <text x="0" y="95" font-family="sans-serif" font-size="52" fill="#FFFFFF" font-weight="800" letter-spacing="-0.5">WayPoint</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" fill="#00E5FF" font-weight="600">Enterprise Delivery Planning System</text>
    <text x="0" y="165" font-family="monospace" font-size="13" fill="#94A3B8">Design Challenge &bull; Tech-Triathlon 2026</text>

    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="80" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="40" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Figma</text>

      <rect x="90" y="0" width="90" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="135" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">FigJam</text>

      <rect x="190" y="0" width="115" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="247" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Auto Layout</text>

      <rect x="315" y="0" width="125" height="28" rx="4" fill="#1A202C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="377" y="18" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">Design System</text>
    </g>

    <g transform="translate(0, 265)">
      <circle cx="8" cy="12" r="5" fill="#00E5FF" />
      <text x="25" y="16" font-family="monospace" font-size="15" fill="#CBD5E1">Automated dispatch control tower &amp; multi-tier navigation</text>

      <circle cx="8" cy="46" r="5" fill="#D4FF00" />
      <text x="25" y="50" font-family="monospace" font-size="15" fill="#CBD5E1">Interactive delivery driver route maps &amp; status modals</text>

      <circle cx="8" cy="80" r="5" fill="#00E5FF" />
      <text x="25" y="84" font-family="monospace" font-size="15" fill="#CBD5E1">Reusable component variants &amp; developer handoff tokens</text>
    </g>

    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="260" height="42" rx="4" fill="#00E5FF" />
      <text x="130" y="26" font-family="monospace" font-size="14" fill="#0D1117" font-weight="bold" text-anchor="middle">INTERACTIVE FIGMA SPEC</text>
    </g>
  </g>

  <!-- Right: Dashboard Wireframe Graphic -->
  <g transform="translate(680, 85)">
    <rect x="0" y="0" width="460" height="490" rx="12" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />
    <rect x="0" y="0" width="460" height="40" rx="12" fill="#1F242C" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" />
    <circle cx="52" cy="20" r="5" fill="#10B981" />
    <text x="230" y="25" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">waypoint-dispatch-v2.fig</text>

    <!-- UI Mockup Cards -->
    <rect x="20" y="60" width="130" height="70" rx="6" fill="#12161D" stroke="rgba(0,229,255,0.3)" stroke-width="1" />
    <text x="32" y="85" font-family="monospace" font-size="10" fill="#94A3B8">ACTIVE FLEET</text>
    <text x="32" y="115" font-family="sans-serif" font-size="24" fill="#00E5FF" font-weight="bold">142</text>

    <rect x="165" y="60" width="130" height="70" rx="6" fill="#12161D" stroke="rgba(212,255,0,0.3)" stroke-width="1" />
    <text x="177" y="85" font-family="monospace" font-size="10" fill="#94A3B8">ON-TIME RATE</text>
    <text x="177" y="115" font-family="sans-serif" font-size="24" fill="#D4FF00" font-weight="bold">98.4%</text>

    <rect x="310" y="60" width="130" height="70" rx="6" fill="#12161D" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="322" y="85" font-family="monospace" font-size="10" fill="#94A3B8">DISPATCHED</text>
    <text x="322" y="115" font-family="sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold">1,894</text>

    <!-- Route Map Container -->
    <rect x="20" y="150" width="420" height="200" rx="8" fill="#12161D" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Map lines -->
    <path d="M 40 280 Q 140 200 240 240 T 400 180" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6 3" />
    <circle cx="40" cy="280" r="7" fill="#00E5FF" />
    <circle cx="240" cy="240" r="7" fill="#D4FF00" />
    <circle cx="400" cy="180" r="9" fill="#10B981" />
    <text x="400" y="170" font-family="monospace" font-size="10" fill="#10B981" text-anchor="middle">HUB-DELIVERED</text>

    <!-- Table preview rows -->
    <rect x="20" y="370" width="420" height="30" rx="4" fill="#1C212A" />
    <text x="35" y="390" font-family="monospace" font-size="11" fill="#E2E8F0">TRK-9021 &bull; Colombo North Hub &bull; Dispatched</text>

    <rect x="20" y="410" width="420" height="30" rx="4" fill="#1C212A" />
    <text x="35" y="430" font-family="monospace" font-size="11" fill="#E2E8F0">TRK-9022 &bull; Kandy Express Route &bull; In Transit</text>

    <rect x="20" y="450" width="420" height="30" rx="4" fill="#1C212A" />
    <text x="35" y="470" font-family="monospace" font-size="11" fill="#E2E8F0">TRK-9023 &bull; Galle Coastal Zone &bull; Preparing</text>
  </g>
</svg>
